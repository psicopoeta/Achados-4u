name: Atualizar Vitrine de Achadinhos

on:
  schedule:
    - cron: '0 0 * * *' # Executa de forma automatizada todos os dias à meia-noite
  workflow_dispatch:     # Permite que você clique em um botão para atualizar na hora que quiser

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permite que o robô altere o arquivo produtos.json no site

    steps:
    - name: Baixar codigo do repositorio
      uses: actions/checkout@v4

    - name: Configurar o Python no Servidor
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Executar Script de Integracao
      env:
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      run: python atualizar.py

    - name: Salvar e Enviar Atualizacoes para o Site
      run: |
        git config --global user.name "Robo de Atualizacao"
        git config --global user.email "actions@github.com"
        git add produtos.json
        git diff --quiet && git diff --cached --quiet || (git commit -m "Vitrine atualizada automaticamente via Planilha" && git push)
