name: Atualizar Vitrine de Achadinhos

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [planilha_atualizada]

jobs:
  atualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rodar script
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python atualizar.py

      - name: Commit do produtos.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add produtos.json
          git diff --cached --quiet && echo "Sem alterações na planilha." && exit 0
          git commit -m "chore: atualiza produtos.json"
          git push origin main


  
